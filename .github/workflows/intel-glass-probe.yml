name: OmniWM Intel glass probe

# Which requirements of native glass do Apple silicon and Intel have on macOS 26 and 27?
on:
  push:
    branches: ['intel/**']
    paths: ['.github/workflows/intel-glass-probe.yml', 'Scripts/intel/glass_probe.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Glass requirements (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # macos-26 is Apple silicon and macos-26-intel is Intel; xcode-27 runs macOS 27 on Apple silicon.
        runner: [macos-26, macos-26-intel, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record the machine and check the requirements
        shell: bash
        run: |
          mkdir -p .build/intel-glass
          {
            sw_vers
            uname -m
            sysctl -n machdep.cpu.brand_string
          } 2>&1 | tee .build/intel-glass/runner.txt
          python3 Scripts/intel/glass_probe.py --report .build/intel-glass/glass.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: intel-glass-${{ matrix.runner }}
          path: .build/intel-glass/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          overwrite: true
