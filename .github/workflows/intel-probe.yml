name: OmniWM Intel XCTest probe

# Can an x86_64 XCTest bundle from the pinned toolchain run under Rosetta, and on an Intel Mac?
# It builds a three-test package only: neither GhosttyKit nor the app.
on:
  push:
    branches: ['intel/**']
    paths: ['.github/workflows/intel-probe.yml', 'Scripts/intel/probe/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  # Only builds, so that nothing about running the bundle can keep it from being produced.
  build:
    name: Build the probe bundle (x86_64)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - name: Build the test bundle
        run: >-
          swift build --package-path Scripts/intel/probe --build-tests --build-system swiftbuild
          --arch x86_64 --scratch-path .build/probe
      - name: Check the architecture of the bundle
        run: >-
          python3 Scripts/intel/verify_products.py .build/probe/out/Products/Debug
          --report .build/probe-reports/products.json
      - name: Archive the bundle
        run: |
          scratch=.build/probe
          tar -cf "$RUNNER_TEMP/probe.tar" \
            --exclude="$scratch/out/Intermediates.noindex" \
            --exclude="$scratch/out/ModuleCache.noindex" \
            --exclude="$scratch/out/SDKExplicitPrecompiledModules.noindex" \
            --exclude="$scratch/out/Products/Debug/index" \
            --exclude='*.o' --exclude='*.swiftmodule' \
            "$scratch" .build/probe-reports/products.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: intel-probe-bundle
          path: ${{ runner.temp }}/probe.tar
          retention-days: 30
          overwrite: true

  rosetta:
    name: Run under Rosetta (xcode-27)
    needs: build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: intel-probe-bundle
      - name: Restore the bundle
        run: tar -xf probe.tar && rm probe.tar
      - name: Make Rosetta available
        shell: bash
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          echo "proc_translated=$(arch -x86_64 /usr/sbin/sysctl -n sysctl.proc_translated)"
      - name: Load and run the tests
        timeout-minutes: 20
        shell: bash
        run: |
          resources="$(swift -print-target-info | jq -er .paths.runtimeResourcePath)"
          bundle="$(find .build/probe/out/Products/Debug -maxdepth 1 -name '*.xctest' | awk 'NR == 1')"
          python3 Scripts/intel/probe/run_probe.py "$bundle" --translated \
            --output-dir .build/probe-reports/rosetta \
            --swift "${resources%/lib/swift}/bin/swift" \
            --package-path Scripts/intel/probe --scratch-path .build/probe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: intel-probe-rosetta
          path: .build/probe-reports/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          overwrite: true

  native:
    name: Run on an Intel Mac (macos-26-intel)
    needs: build
    runs-on: macos-26-intel
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: intel-probe-bundle
      - name: Restore the bundle
        run: tar -xf probe.tar && rm probe.tar
      - name: Load and run the tests
        timeout-minutes: 10
        shell: bash
        run: |
          bundle="$(find .build/probe/out/Products/Debug -maxdepth 1 -name '*.xctest' | awk 'NR == 1')"
          python3 Scripts/intel/probe/run_probe.py "$bundle" --output-dir .build/probe-reports/native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: intel-probe-native
          path: .build/probe-reports/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          overwrite: true
