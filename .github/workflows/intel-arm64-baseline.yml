name: OmniWM Intel arm64 baseline

# Which tests that fail on an Intel Mac with macOS 26 also fail on Apple silicon with macOS 26?
# Scripts/intel/baseline/tests.txt holds the native failures of OmniWM Intel run 46136363429. Both
# machines run exactly that selection; the x86_64 bundle is the one of that run.
on:
  push:
    branches: ['intel/**']
    paths: ['.github/workflows/intel-arm64-baseline.yml', 'Scripts/intel/baseline/**']
  workflow_dispatch:

permissions:
  contents: read
  # To read the x86_64 test bundle of an earlier run.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test build (arm64)
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - uses: ./.github/actions/setup-lix
        with:
          make-target: setup
      # Linked weakly for the same reason as the x86_64 tests: without it the bundle cannot load on macOS 26.
      - name: Build the app and test bundle
        shell: bash
        run: |
          LIBRARY_PATH="$(./Scripts/ghostty-preflight.sh print-library-dir)" \
            swift build --build-tests --build-system swiftbuild --arch arm64 --scratch-path .build/arm64-tests \
            -Xlinker -weak-lswift_Concurrency
          bundle="$(find .build/arm64-tests/out/Products/Debug -maxdepth 1 -name '*.xctest')"
          [[ "$(lipo -archs "$bundle/Contents/MacOS/OmniWMTests")" == arm64 ]]
      - name: Archive the test runtime
        run: |
          scratch=.build/arm64-tests
          tar -cf "$RUNNER_TEMP/swift-tests-arm64.tar" \
            --exclude="$scratch/out/Intermediates.noindex" \
            --exclude="$scratch/out/ModuleCache.noindex" \
            --exclude="$scratch/out/SDKExplicitPrecompiledModules.noindex" \
            --exclude="$scratch/repositories" \
            --exclude="$scratch/out/Products/Debug/index" \
            --exclude="$scratch/out/Products/Debug/*.a" \
            --exclude='*.o' --exclude='*.swiftmodule' \
            "$scratch"
          tar -rhf "$RUNNER_TEMP/swift-tests-arm64.tar" Frameworks/GhosttyKit.xcframework
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: swift-tests-arm64
          path: ${{ runner.temp }}/swift-tests-arm64.tar
          compression-level: 1
          retention-days: 3
          overwrite: true

  compare:
    name: Failed tests on ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            scratch: .build/arm64-tests
          - runner: macos-26-intel
            arch: x86_64
            scratch: .build/intel-tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: matrix.arch == 'arm64'
        with:
          name: swift-tests-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: matrix.arch == 'x86_64'
        with:
          name: swift-tests-x86_64
          run-id: 46136363429
          github-token: ${{ github.token }}
      - name: Restore the test runtime
        env:
          ARCH: ${{ matrix.arch }}
        run: tar -xf "swift-tests-$ARCH.tar" && rm "swift-tests-$ARCH.tar"
      # The Intel image's icon service aborts on the virtual GPU (actions/runner-images#14751).
      - name: Unload the broken icon service of the Intel runner
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          service="gui/$(id -u)/com.apple.iconservices.iconservicesagent"
          launchctl bootout "$service" || echo "the agent was not loaded"
          launchctl disable "$service"
      - name: Record the machine and its Metal device
        shell: bash
        run: |
          mkdir -p .build/baseline
          {
            sw_vers
            uname -m
            sysctl -n machdep.cpu.brand_string
            csrutil status
            for shell in fish nu; do echo "$shell: $(command -v "$shell" || echo not installed)"; done
          } 2>&1 | tee .build/baseline/runner.txt
          xcrun swiftc Scripts/intel/metal_probe.swift -o "$RUNNER_TEMP/metal_probe"
          "$RUNNER_TEMP/metal_probe" | tee .build/baseline/metal.json
      # Failures are the result being compared, so they do not stop the job.
      - name: Run the selected tests
        timeout-minutes: 20
        continue-on-error: true
        shell: bash
        env:
          SCRATCH: ${{ matrix.scratch }}
        run: |
          bundle="$(find "$SCRATCH/out/Products/Debug" -maxdepth 1 -name '*.xctest')"
          python3 Scripts/intel/run_tests.py run --bundle "$bundle" --list Scripts/intel/baseline/tests.txt \
            --flag=--filter --pattern=OmniWMTests --report .build/baseline/run.json 2>&1 \
            | tee .build/baseline/tests.log
      - name: Summarize
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          python3 Scripts/intel/test_report.py .build/baseline/tests.log \
            --expected Scripts/intel/baseline/tests.txt \
            --output .build/baseline/summary.json --markdown "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: intel-baseline-${{ matrix.arch }}
          path: .build/baseline/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          overwrite: true
