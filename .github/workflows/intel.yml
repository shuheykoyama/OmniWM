name: OmniWM Intel

on:
  push:
    branches: ['intel/**']
    paths-ignore: ['docs/**', 'website/**', '*.md']
  # Manual dispatch only becomes available once this file exists on the default branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  ghostty:
    name: GhosttyKit (x86_64)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record the runner
        shell: bash
        run: |
          mkdir -p .build/intel-reports
          {
            echo "## runner"
            sw_vers
            echo "architecture: $(uname -m)"
            sysctl hw.ncpu hw.memsize
            xcodebuild -version
            echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"
            xcrun swift --version
            echo "## disk before the build"
            df -h .
          } 2>&1 | tee .build/intel-reports/runner.txt
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent metalToolchain
      - name: Identify the toolchain
        id: toolchain
        shell: bash
        run: |
          xcode="$(xcodebuild -version | awk '/^Build version/ { print $3 }')"
          # Only the first line is stable; later lines name a random mount point.
          metal="$(xcrun -sdk macosx metal --version | awk 'NR == 1')"
          echo "$metal" | tee -a .build/intel-reports/runner.txt
          metal_id="$(echo "$metal" | shasum -a 256 | cut -c1-16)"
          echo "id=$xcode-$metal_id" >> "$GITHUB_OUTPUT"
      # The key covers the source revision and Zig version (dev-tools.env), the Zig hash and
      # build settings (the two build scripts), gettext (flake) and the compilers (toolchain id).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: |
            .build/intel-ghostty/GhosttyKit.xcframework.zip
            .build/intel-ghostty/provenance.json
          key: ghosttykit-x86_64-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Scripts/intel/build_ghostty.py', 'Scripts/build-ghosttykit.py', 'Scripts/dev-tools.env', 'flake.nix', 'flake.lock') }}
      - uses: ./.github/actions/setup-lix
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Install translation build tools
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          # The job's read-only token, only to avoid anonymous GitHub rate limits.
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
        run: |
          gettext_out="$(nix build --no-link --print-out-paths .#gettext)"
          echo "${gettext_out}/bin" >> "$GITHUB_PATH"
      - name: Build the pinned Ghostty revision for x86_64
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 Scripts/intel/build_ghostty.py
      - name: Verify the x86_64 GhosttyKit
        run: python3 Scripts/intel/verify_ghostty.py
      - name: Record the disk after the build
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          {
            echo "## disk after the build (cache hit: ${CACHE_HIT:-false})"
            df -h .
            du -sh .build/* || true
          } 2>&1 | tee -a .build/intel-reports/runner.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: ghosttykit-x86_64
          path: |
            .build/intel-ghostty/GhosttyKit.xcframework.zip
            .build/intel-ghostty/provenance.json
            .build/intel-reports/verification.json
            .build/intel-reports/runner.txt
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0
          retention-days: 30

  app:
    name: OmniWM.app (x86_64)
    needs: ghostty
    # Temporary: only the test jobs change, and the app of commit 24461ae701 still matches the product
    # code, so pushes do not rebuild it. Remove this condition with the next change to the app or its
    # packaging.
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      OMNIWM_ARCH: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - name: Record the runner
        shell: bash
        run: |
          mkdir -p .build/intel-app-reports
          {
            echo "## runner"
            sw_vers
            echo "architecture: $(uname -m)"
            sysctl hw.ncpu hw.memsize
            xcodebuild -version
            echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"
            swift --version
            python3 --version
            echo "## disk before the build"
            df -h .
          } 2>&1 | tee .build/intel-app-reports/runner.txt
      - uses: ./.github/actions/setup-intel-ghostty
        with:
          report: .build/intel-app-reports/ghostty-verification.json
      # With no signing identity on the runner, "dev" signs ad hoc.
      - name: Build and package the app
        run: Scripts/package-app.sh release dev
      - name: Verify and archive the app
        run: python3 Scripts/intel/verify_app.py --ghostty-provenance .build/ghostty-artifact/intel-ghostty/provenance.json
      # Kept beside the app, not inside it, to read crash reports from the real machine later.
      - name: Archive the debug symbols of the packaged binaries
        shell: bash
        run: |
          find .build -type d -name '*.dSYM' -prune | tee .build/intel-app-reports/dsym-locations.txt
          python3 Scripts/intel/collect_dsyms.py 2>&1 | tee .build/intel-app-reports/dsym-verification.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: omniwm-x86_64-dsyms
          path: .build/intel-symbols/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
          overwrite: true
      # The release link reports "input verification failed" without detail, so keep the
      # verifier's findings for one object of every target.
      - name: Sample the debug information findings
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          root=.build/out/Intermediates.noindex/OmniWM.build/Release
          {
            for directory in "$root"/*.build/Objects-normal/x86_64; do
              object="$(find "$directory" -name '*.o' | sort | awk 'NR == 1')"
              [[ -n "$object" ]] || continue
              echo "== ${object#"$root"/}"
              xcrun dwarfdump --verify --error-display=details "$object" 2>&1 \
                | awk '/^(error|warning):/ && ++shown <= 8; /^(No errors|Errors detected)/' || true
            done
          } | tee .build/intel-app-reports/dwarf-findings.txt
      - name: Record the disk after the build
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "## disk after the build"
            df -h .
            du -sh .build/* dist || true
          } 2>&1 | tee -a .build/intel-app-reports/runner.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: omniwm-x86_64
          path: |
            .build/intel-app/OmniWM-x86_64.zip
            .build/intel-app/SHA256SUMS
            .build/intel-app/provenance.json
            .build/intel-app/verification.json
            .build/intel-app-reports/ghostty-verification.json
            .build/intel-app-reports/dwarf-findings.txt
            .build/intel-app-reports/dsym-locations.txt
            .build/intel-app-reports/dsym-verification.txt
            .build/intel-app-reports/runner.txt
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0
          retention-days: 30

  # The bundle is built and archived before anything about running it is checked.
  test-build:
    name: Test build (x86_64)
    needs: ghostty
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      OMNIWM_ARCH: x86_64
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      # The shards are the upstream ones, as a full run of its CI plans them.
      - name: Plan the Swift test groups
        id: plan
        run: python3 Scripts/ci_test_plan.py workflow_dispatch < /dev/null >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-intel-ghostty
        with:
          report: .build/intel-test-reports/ghostty-verification.json
      - name: Build the x86_64 app and test bundle
        shell: bash
        run: |
          LIBRARY_PATH="$(./Scripts/ghostty-preflight.sh print-library-dir)" \
            swift build --build-tests --build-system swiftbuild --arch x86_64 --scratch-path .build/intel-tests
      # Workaround for the pinned toolchain, in test builds only: it makes a macOS 27 runtime function a
      # strong import, so the bundle cannot load on macOS 26. See docs/intel-build-plan.md for its removal.
      - name: Link the test products again with weak Swift Concurrency
        shell: bash
        run: |
          products=.build/intel-tests/out/Products/Debug
          python3 Scripts/intel/verify_test_linkage.py record "$products" \
            --report "$RUNNER_TEMP/linkage-before.json"
          LIBRARY_PATH="$(./Scripts/ghostty-preflight.sh print-library-dir)" \
            swift build --build-tests --build-system swiftbuild --arch x86_64 --scratch-path .build/intel-tests \
            -Xlinker -weak-lswift_Concurrency
          python3 Scripts/intel/verify_test_linkage.py compare "$products" \
            --before "$RUNNER_TEMP/linkage-before.json" --report .build/intel-test-reports/linkage.json
      - name: Check the architecture of the built products
        run: >-
          python3 Scripts/intel/verify_products.py .build/intel-tests/out/Products/Debug
          --report .build/intel-test-reports/products.json
      - name: Archive the test runtime
        run: |
          scratch=.build/intel-tests
          tar -cf "$RUNNER_TEMP/swift-tests-x86_64.tar" \
            --exclude="$scratch/out/Intermediates.noindex" \
            --exclude="$scratch/out/ModuleCache.noindex" \
            --exclude="$scratch/out/SDKExplicitPrecompiledModules.noindex" \
            --exclude="$scratch/repositories" \
            --exclude="$scratch/out/Products/Debug/index" \
            --exclude="$scratch/out/Products/Debug/*.a" \
            --exclude='*.o' --exclude='*.swiftmodule' \
            "$scratch"
          tar -rhf "$RUNNER_TEMP/swift-tests-x86_64.tar" Frameworks/GhosttyKit.xcframework
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: swift-tests-x86_64
          path: ${{ runner.temp }}/swift-tests-x86_64.tar
          compression-level: 1
          retention-days: 3
          overwrite: true
      - name: Check Rosetta
        shell: bash
        run: ./Scripts/intel/rosetta.sh 2>&1 | tee .build/intel-test-reports/rosetta-environment.txt
      # Also proves, before the shards start, that the bundle loads under Rosetta.
      - name: List the tests and check the test groups
        shell: bash
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
        run: |
          reports=.build/intel-test-reports
          resources="$(swift -print-target-info | jq -er .paths.runtimeResourcePath)"
          developer="$(xcrun --sdk macosx --show-sdk-platform-path)/Developer"
          bundle="$(find .build/intel-tests/out/Products/Debug -maxdepth 1 -name '*.xctest')"
          "${resources%/lib/swift}/bin/swiftc" -target x86_64-apple-macos26.0 \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -F "$developer/Library/Frameworks" -I "$developer/usr/lib" -L "$developer/usr/lib" \
            Scripts/intel/list_tests.swift -o "$RUNNER_TEMP/list_tests"
          python3 Scripts/intel/run_tests.py list --translated --testing-path "$resources/macosx/testing" \
            --bundle "$bundle" --lister "$RUNNER_TEMP/list_tests" --output "$reports/expected-tests.txt"
          python3 Scripts/intel/run_tests.py check --bundle "$bundle" --list "$reports/expected-tests.txt" \
            --matrix "$MATRIX" --tests-dir Tests/OmniWMTests --report "$reports/test-groups.json"
      # Machine-dependent tests: compiled so they keep building for x86_64, never run here.
      - name: Compile the live checks
        shell: bash
        run: |
          OMNIWM_LIVE_CHECKS=1 LIBRARY_PATH="$(./Scripts/ghostty-preflight.sh print-library-dir)" \
            swift build --build-tests --build-system swiftbuild --arch x86_64 --scratch-path .build/intel-tests \
            -Xlinker -weak-lswift_Concurrency
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: intel-test-list
          path: .build/intel-test-reports/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          overwrite: true

  test:
    name: Tests x86_64 Rosetta (${{ matrix.name }})
    needs: test-build
    runs-on: xcode-27
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-build.outputs.matrix) }}
    env:
      OMNIWM_ARCH: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # xctest runs the bundle; the toolchain supplies the Swift Testing libraries SwiftPM would add.
      - uses: ./.github/actions/setup-swift
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: swift-tests-x86_64
      - name: Restore the test runtime
        run: tar -xf swift-tests-x86_64.tar && rm swift-tests-x86_64.tar
      - uses: ./.github/actions/setup-lix
        if: matrix.shells
        with:
          make-target: setup-tools
      - name: Put completion test shells on PATH
        if: matrix.shells
        run: |
          echo "$PWD/.cache/flake-tools/bin" >> "$GITHUB_PATH"
          .cache/flake-tools/bin/fish --version
          .cache/flake-tools/bin/nu --version
      - name: Check Rosetta
        shell: bash
        env:
          SHARD: ${{ strategy.job-index }}
        run: |
          mkdir -p .build/intel-test-reports
          ./Scripts/intel/rosetta.sh 2>&1 | tee ".build/intel-test-reports/rosetta-environment-$SHARD.txt"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: intel-test-list
          path: .build/intel-test-list
      - name: Check that the restored products are the built x86_64 ones
        shell: bash
        env:
          SHARD: ${{ strategy.job-index }}
        run: |
          python3 Scripts/intel/verify_products.py .build/intel-tests/out/Products/Debug \
            --report ".build/intel-test-reports/products-before-$SHARD.json" \
            --expect .build/intel-test-list/products.json > /dev/null
          touch "$RUNNER_TEMP/test-run-started"
      # The step limit is below the job limit, so a hung test still leaves its log.
      - name: Run the test group under Rosetta
        timeout-minutes: 50
        shell: bash
        env:
          FLAG: ${{ matrix.flag }}
          PATTERN: ${{ matrix.pattern }}
          SHARD: ${{ strategy.job-index }}
        run: |
          resources="$(swift -print-target-info | jq -er .paths.runtimeResourcePath)"
          bundle="$(find .build/intel-tests/out/Products/Debug -maxdepth 1 -name '*.xctest')"
          python3 Scripts/intel/run_tests.py run --translated --testing-path "$resources/macosx/testing" \
            --bundle "$bundle" --list .build/intel-test-list/expected-tests.txt --flag="$FLAG" --pattern="$PATTERN" \
            --report ".build/intel-test-reports/run-rosetta-$SHARD.json" 2>&1 \
            | tee ".build/intel-test-reports/rosetta-$SHARD.log"
      - name: Check that the products are unchanged
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SHARD: ${{ strategy.job-index }}
        run: |
          python3 Scripts/intel/verify_products.py .build/intel-tests/out/Products/Debug \
            --report ".build/intel-test-reports/products-after-$SHARD.json" \
            --expect .build/intel-test-list/products.json \
            --unchanged-since "$RUNNER_TEMP/test-run-started" > /dev/null
          echo "products identical and not rewritten"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: intel-test-log-${{ strategy.job-index }}
          path: .build/intel-test-reports/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          overwrite: true

  # Supplementary, not a gate: the same bundle and test groups on an Intel Mac with macOS 26 and its
  # XCTest. Nothing is installed, so what depends on the toolchain, fish or Nushell shows up here.
  test-native:
    name: Tests x86_64 native (${{ matrix.name }})
    needs: test-build
    runs-on: macos-26-intel
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-build.outputs.matrix) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: swift-tests-x86_64
      - name: Restore the test runtime
        run: tar -xf swift-tests-x86_64.tar && rm swift-tests-x86_64.tar
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: intel-test-list
          path: .build/intel-test-list
      - name: Record the runner
        shell: bash
        env:
          SHARD: ${{ strategy.job-index }}
        run: |
          mkdir -p .build/intel-native-reports
          {
            sw_vers
            echo "architecture: $(uname -m)"
            echo "proc_translated: $(sysctl -n sysctl.proc_translated 2>/dev/null || echo not-applicable)"
            sysctl hw.ncpu hw.memsize
            xcodebuild -version
            csrutil status
            for shell in fish nu; do echo "$shell: $(command -v "$shell" || echo not installed)"; done
            system_profiler SPDisplaysDataType
          } 2>&1 | tee ".build/intel-native-reports/native-environment-$SHARD.txt"
      - name: Check that the restored products are the built x86_64 ones
        shell: bash
        env:
          SHARD: ${{ strategy.job-index }}
        run: |
          python3 Scripts/intel/verify_products.py .build/intel-tests/out/Products/Debug \
            --report ".build/intel-native-reports/products-before-$SHARD.json" \
            --expect .build/intel-test-list/products.json > /dev/null
          touch "$RUNNER_TEMP/test-run-started"
      # Which Swift runtime symbols the products import that this macOS does not have.
      - name: Look for missing Swift runtime symbols
        if: strategy.job-index == 0
        continue-on-error: true
        shell: bash
        run: |
          python3 Scripts/intel/verify_test_linkage.py missing .build/intel-tests/out/Products/Debug \
            --report .build/intel-native-reports/missing-symbols.json
      - name: Run the test group natively
        timeout-minutes: 70
        shell: bash
        env:
          FLAG: ${{ matrix.flag }}
          PATTERN: ${{ matrix.pattern }}
          SHARD: ${{ strategy.job-index }}
        run: |
          bundle="$(find .build/intel-tests/out/Products/Debug -maxdepth 1 -name '*.xctest')"
          python3 Scripts/intel/run_tests.py run \
            --bundle "$bundle" --list .build/intel-test-list/expected-tests.txt --flag="$FLAG" --pattern="$PATTERN" \
            --report ".build/intel-native-reports/run-native-$SHARD.json" 2>&1 \
            | tee ".build/intel-native-reports/native-$SHARD.log"
      - name: Check that the products are unchanged
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SHARD: ${{ strategy.job-index }}
        run: |
          python3 Scripts/intel/verify_products.py .build/intel-tests/out/Products/Debug \
            --report ".build/intel-native-reports/products-after-$SHARD.json" \
            --expect .build/intel-test-list/products.json \
            --unchanged-since "$RUNNER_TEMP/test-run-started" > /dev/null
          echo "products identical and not rewritten"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: intel-native-log-${{ strategy.job-index }}
          path: .build/intel-native-reports/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          overwrite: true

  # The gate is the Rosetta run; the native one is summarized next to it.
  test-report:
    name: Tests x86_64
    needs: [test-build, test, test-native]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: intel-test-*
          path: .build/intel-test-reports
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: intel-native-log-*
          path: .build/intel-native-reports
          merge-multiple: true
      - name: Require every listed test to pass under Rosetta
        shell: bash
        run: |
          reports=.build/intel-test-reports
          echo "# Rosetta (gate)" >> "$GITHUB_STEP_SUMMARY"
          python3 Scripts/intel/test_report.py "$reports"/rosetta-[0-9]*.log \
            --expected "$reports/expected-tests.txt" \
            --require OmniWMTests.AppSelfUpdaterTests \
            --require OmniWMTests.UpdateCoordinatorTests \
            --require OmniWMTests.GitHubReleaseUpdateTests \
            --require OmniWMTests.GitHubReleaseServiceTests \
            --output "$reports/rosetta-summary.json" --markdown "$GITHUB_STEP_SUMMARY"
      - name: Summarize the native run
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          echo "# Native Intel (supplementary)" >> "$GITHUB_STEP_SUMMARY"
          python3 Scripts/intel/test_report.py .build/intel-native-reports/native-[0-9]*.log \
            --expected .build/intel-test-reports/expected-tests.txt \
            --require OmniWMTests.AppSelfUpdaterTests \
            --require OmniWMTests.UpdateCoordinatorTests \
            --require OmniWMTests.GitHubReleaseUpdateTests \
            --require OmniWMTests.GitHubReleaseServiceTests \
            --output .build/intel-test-reports/native-summary.json --markdown "$GITHUB_STEP_SUMMARY"
      - name: Require every Rosetta shard to have succeeded
        env:
          BUILD: ${{ needs.test-build.result }}
          SHARDS: ${{ needs.test.result }}
        run: |
          [[ "$BUILD" == success && "$SHARDS" == success ]] || {
            echo "::error::Test build $BUILD, test groups $SHARDS."
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: intel-test-summary
          path: .build/intel-test-reports/*-summary.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          overwrite: true

  # A supplementary check on the packaged app, not a gate. It runs only on this disposable
  # machine, grants nothing, and leaves SIP and Gatekeeper as they are.
  app-smoke:
    name: App smoke test on Intel (supplementary)
    needs: app
    runs-on: macos-26-intel
    timeout-minutes: 20
    continue-on-error: true
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: omniwm-x86_64
          path: .build/app-artifact
      - name: Record the machine
        shell: bash
        run: |
          mkdir -p .build/intel-smoke-reports
          {
            sw_vers
            echo "architecture: $(uname -m)"
            sysctl hw.ncpu hw.memsize
            csrutil status
            spctl --status || true
            echo "console user: $(stat -f %Su /dev/console)"
          } 2>&1 | tee .build/intel-smoke-reports/runner.txt
      - name: Unpack the packaged app
        shell: bash
        run: |
          (cd .build/app-artifact/intel-app && shasum -a 256 -c SHA256SUMS)
          ditto -x -k .build/app-artifact/intel-app/OmniWM-x86_64.zip "$RUNNER_TEMP/smoke"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/smoke/OmniWM.app"
          xattr -lr "$RUNNER_TEMP/smoke/OmniWM.app" | tee .build/intel-smoke-reports/xattr.txt
      - name: Build the window lister
        run: xcrun swiftc Scripts/intel/list_windows.swift -o "$RUNNER_TEMP/list_windows"
      - name: Run the CLI and launch the app
        timeout-minutes: 8
        run: |
          python3 Scripts/intel/smoke_app.py "$RUNNER_TEMP/smoke/OmniWM.app" \
            --output-dir .build/intel-smoke-reports --seconds 20 --window-lister "$RUNNER_TEMP/list_windows"
      - name: Collect diagnostics
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          reports=.build/intel-smoke-reports
          log show --last 10m --style compact --info \
            --predicate 'process == "OmniWM" OR process == "omniwmctl"' 2>&1 \
            | tail -n 2000 > "$reports/system-log.txt" || true
          {
            echo "## processes mentioning OmniWM"
            pgrep -fil omniwm || echo none
            echo "## files the app created"
            find "$HOME/.config/omniwm" "$HOME/.local/state/omniwm" -type f 2>/dev/null || echo none
          } | tee "$reports/after.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: intel-app-smoke
          path: .build/intel-smoke-reports/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          overwrite: true
