name: OmniWM Intel cancellation probe

# Does weak-linking libswift_Concurrency let tests that read Task.isCancelled run on macOS 26?
# It builds a small test package only: neither GhosttyKit nor the app.
on:
  push:
    branches: ['intel/**']
    paths: ['.github/workflows/intel-cancellation-probe.yml', 'Scripts/intel/cancellation-probe/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  build:
    name: Build and inspect the variants (x86_64)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - name: Build each variant and compare its imports
        shell: bash
        run: |
          resources="$(swift -print-target-info | jq -er .paths.runtimeResourcePath)"
          python3 Scripts/intel/cancellation-probe/probe.py build --swift "${resources%/lib/swift}/bin/swift" \
            --scratch .build/cancellation-probe --report .build/cancellation-reports/imports.json
      - name: Archive the bundles
        run: |
          tar -cf "$RUNNER_TEMP/cancellation-probe.tar" \
            --exclude='*.o' --exclude='*.swiftmodule' \
            .build/cancellation-probe/*/out/Products/Debug/OmniWMTests.xctest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: intel-cancellation-bundles
          path: ${{ runner.temp }}/cancellation-probe.tar
          retention-days: 30
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: intel-cancellation-imports
          path: .build/cancellation-reports/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          overwrite: true

  rosetta:
    name: Run under Rosetta (xcode-27)
    needs: build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: intel-cancellation-bundles
      - name: Restore the bundles
        run: tar -xf cancellation-probe.tar && rm cancellation-probe.tar
      - name: Check Rosetta
        run: ./Scripts/intel/rosetta.sh
      - name: Run every variant
        timeout-minutes: 15
        shell: bash
        run: |
          resources="$(swift -print-target-info | jq -er .paths.runtimeResourcePath)"
          python3 Scripts/intel/cancellation-probe/probe.py run --translated \
            --testing-path "$resources/macosx/testing" \
            --scratch .build/cancellation-probe --output-dir .build/cancellation-reports/rosetta
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: intel-cancellation-rosetta
          path: .build/cancellation-reports/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          overwrite: true

  native:
    name: Run on an Intel Mac (macos-26-intel)
    needs: build
    runs-on: macos-26-intel
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: intel-cancellation-bundles
      - name: Restore the bundles
        run: tar -xf cancellation-probe.tar && rm cancellation-probe.tar
      # The variant without weak linking is expected not to load here; its result is recorded.
      - name: Run every variant
        timeout-minutes: 10
        run: |
          sw_vers
          python3 Scripts/intel/cancellation-probe/probe.py run --may-fail baseline \
            --scratch .build/cancellation-probe --output-dir .build/cancellation-reports/native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: intel-cancellation-native
          path: .build/cancellation-reports/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          overwrite: true
